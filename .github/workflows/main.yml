name: Build Frost Strength SMP

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout your code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: 17
          distribution: 'temurin'

      # 3. Build with Maven (IMPORTANT: cd into FrostStrengthSMP/ where pom.xml lives)
      - name: Build with Maven
        run: |
          cd FrostStrengthSMP
          mvn clean package -DskipTests

      # 4. Upload the compiled .jar as a downloadable artifact
      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: FrostStrengthSMP-jar
          path: FrostStrengthSMP/target/*.jar
