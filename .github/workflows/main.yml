name: Build Frost Strength SMP

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # lets you run it manually too

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout your code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Java 17 (Paper 26 needs 17+ to run, plugin compiles on 11+)
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: 17
          distribution: 'temurin'

      # 3. Build with Maven
      - name: Build with Maven
        run: mvn clean package -DskipTests

      # 4. Upload the compiled .jar as a downloadable artifact
      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: FrostStrengthSMP-jar
          path: target/*.jar
