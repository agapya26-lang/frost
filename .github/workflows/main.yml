name: Build Frost Strength SMP

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout your code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: 17
          distribution: 'temurin'

      # 3. Find pom.xml and build from the correct directory
      - name: Build with Maven
        run: |
          if [ -f "pom.xml" ]; then
            echo "✓ Found pom.xml at repo root"
            mvn clean package -DskipTests
          elif [ -f "FrostStrengthSMP/pom.xml" ]; then
            echo "✓ Found pom.xml in FrostStrengthSMP/"
            cd FrostStrengthSMP
            mvn clean package -DskipTests
          else
            echo "✗ ERROR: pom.xml not found anywhere!"
            echo "Repo structure:"
            find . -name "pom.xml" -maxdepth 4 2>/dev/null || echo "  (none found)"
            echo "Files at root:"
            ls -la
            exit 1
          fi

      # 4. Upload the compiled .jar artifact (from either location)
      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: FrostStrengthSMP-jar
          path: |
            target/*.jar
            FrostStrengthSMP/target/*.jar
