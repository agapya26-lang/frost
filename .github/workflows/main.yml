name: Build Frost Strength SMP

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout your code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: 17
          distribution: 'temurin'

      # 3. Build with Maven — auto-detects where pom.xml is
      - name: Build with Maven
        run: |
          # Check if pom.xml is at repo root
          if [ -f "pom.xml" ]; then
            echo "Found pom.xml at repo root"
          # Check if pom.xml is in FrostStrengthSMP subfolder
          elif [ -f "FrostStrengthSMP/pom.xml" ]; then
            echo "Found pom.xml in FrostStrengthSMP/"
            cd FrostStrengthSMP
          else
            echo "ERROR: pom.xml not found! Here's the repo structure:"
            find . -name "pom.xml" -maxdepth 3
            exit 1
          fi
          mvn clean package -DskipTests

      # 4. Upload the compiled .jar as a downloadable artifact
      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: FrostStrengthSMP-jar
          path: |
            target/*.jar
            FrostStrengthSMP/target/*.jar
